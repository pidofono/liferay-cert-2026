<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI·CERT — Consulta Inteligente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── Variables ─────────────────────────────────────────────── */
    :root {
      --bg:        #070b12;
      --surface:   #0d1322;
      --border:    #1a2540;
      --cyan:      #00e8c8;
      --cyan-dim:  #00e8c820;
      --amber:     #f5a623;
      --amber-dim: #f5a62318;
      --text:      #c9d6f0;
      --text-dim:  #4a5a7a;
      --user-bg:   #0d2040;
      --user-border:#1a3a6a;
      --ai-bg:     #0d1a10;
      --ai-border: #1a3a22;
      --radius:    16px;
      --font-sans: 'Syne', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    /* ── Reset ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Animated grid background ──────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 30%, transparent 100%);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Glow orbs ─────────────────────────────────────────────── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 520px; height: 520px;
      background: radial-gradient(circle, #00e8c812 0%, transparent 70%);
      top: -180px; left: -120px;
      animation-duration: 22s;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #1a3aff10 0%, transparent 70%);
      bottom: -100px; right: -80px;
      animation-duration: 17s;
      animation-delay: -8s;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.05); }
    }

    /* ── Layout wrapper ────────────────────────────────────────── */
    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 16px;
    }

    /* ── Header ────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--cyan), #007aff);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 18px #00e8c840;
    }

    .logo-text {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #fff;
    }

    .logo-text span {
      color: var(--cyan);
    }

    .header-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--cyan);
      background: var(--cyan-dim);
      border: 1px solid #00e8c830;
      padding: 4px 10px;
      border-radius: 100px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .btn-clear {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-clear:hover {
      border-color: #e05050;
      color: #e05050;
      background: #e0505010;
    }
    .btn-clear svg { width: 12px; height: 12px; }

    /* ── Chat area ─────────────────────────────────────────────── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Empty state ───────────────────────────────────────────── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.6s 0.3s ease forwards;
    }
    .empty-state.hidden { display: none; }

    .empty-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--cyan-dim), #1a3aff10);
      border: 1px solid #00e8c825;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 30px #00e8c818;
    }

    .empty-state h2 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .empty-state p {
      font-size: 14px;
      color: var(--text-dim);
      max-width: 340px;
      line-height: 1.6;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
      max-width: 460px;
    }

    .suggestion {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }
    .suggestion:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      background: var(--cyan-dim);
    }

    /* ── Message bubbles ───────────────────────────────────────── */
    .msg {
      display: flex;
      gap: 12px;
      opacity: 0;
      transform: translateY(12px);
      animation: slideUp 0.35s ease forwards;
    }
    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      margin-top: 2px;
    }

    .msg.user { flex-direction: row-reverse; }

    .msg.user .msg-avatar {
      background: linear-gradient(135deg, #1a3a6a, #0d2040);
      border: 1px solid var(--user-border);
    }
    .msg.ai .msg-avatar {
      background: linear-gradient(135deg, var(--ai-bg), #0d2818);
      border: 1px solid var(--ai-border);
      box-shadow: 0 0 14px #00e8c820;
    }

    .msg-body {
      max-width: 78%;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .msg.user .msg-body { align-items: flex-end; }

    .msg-label {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .msg.user .msg-label { color: #4a6090; }
    .msg.ai  .msg-label { color: #2a6040; }

    .msg-bubble {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    .msg.user .msg-bubble {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      border-top-right-radius: 4px;
      color: #d4e4ff;
    }

    .msg.ai .msg-bubble {
      background: var(--ai-bg);
      border: 1px solid var(--ai-border);
      border-top-left-radius: 4px;
      color: #c8f0d8;
      font-family: var(--font-mono);
      font-size: 13.5px;
      font-weight: 300;
    }

    /* ── Thinking indicator ────────────────────────────────────── */
    .thinking .msg-bubble {
      padding: 16px 22px;
    }

    .dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 7px; height: 7px;
      background: var(--cyan);
      border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
      box-shadow: 0 0 8px var(--cyan);
    }
    .dot:nth-child(2) { animation-delay: 0.2s; background: #40b0ff; }
    .dot:nth-child(3) { animation-delay: 0.4s; background: #a060ff; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
      40%            { transform: scale(1.15); opacity: 1; }
    }

    /* ── Input area ────────────────────────────────────────────── */
    .input-area {
      flex-shrink: 0;
      padding: 16px 0 24px;
      border-top: 1px solid var(--border);
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .input-wrap:focus-within {
      border-color: #00e8c840;
      box-shadow: 0 0 0 3px #00e8c80a, 0 0 28px #00e8c810;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      max-height: 160px;
      min-height: 24px;
      overflow-y: auto;
    }
    textarea::placeholder { color: var(--text-dim); }

    .btn-send {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--cyan), #007aff);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      box-shadow: 0 0 16px #00e8c830;
    }
    .btn-send:hover {
      transform: scale(1.06);
      box-shadow: 0 0 24px #00e8c850;
    }
    .btn-send:active { transform: scale(0.96); }
    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-send svg { width: 16px; height: 16px; }

    .input-hint {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hint-text {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
    }

    .hint-text kbd {
      background: var(--border);
      color: var(--text-dim);
      padding: 1px 5px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 9px;
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
    }

    .status-dot::before {
      content: '';
      width: 6px; height: 6px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--cyan);
      animation: blink 2.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── Error message ─────────────────────────────────────────── */
    .msg.error .msg-bubble {
      background: #200d0d;
      border-color: #5a1a1a;
      color: #f08080;
    }

    /* ── Responsive ────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .header-badge { display: none; }
      .msg-body { max-width: 88%; }
      .msg.ai .msg-bubble { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="wrapper">
    <!-- Header -->
    <header>
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <div class="logo-text">AI<span>·CERT</span></div>
      </div>
      <div class="header-badge">v1.0 · gpt-4.1-mini</div>
      <button class="btn-clear" onclick="clearChat()" title="Limpiar conversación">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
        </svg>
        Limpiar
      </button>
    </header>

    <!-- Chat -->
    <div id="chat">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🤖</div>
        <h2>¿En qué puedo ayudarte?</h2>
        <p>Haz cualquier pregunta a la IA certificada. Las respuestas son generadas por GPT-4.1-mini a través de Liferay.</p>
        <div class="suggestions">
          <button class="suggestion" onclick="sendSuggestion(this)">¿Qué es Liferay?</button>
          <button class="suggestion" onclick="sendSuggestion(this)">Explica los Client Extensions</button>
          <button class="suggestion" onclick="sendSuggestion(this)">¿Cómo crear un REST Builder module?</button>
          <button class="suggestion" onclick="sendSuggestion(this)">Mejores prácticas DXP 2026</button>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-wrap">
        <textarea
          id="questionInput"
          placeholder="Escribe tu pregunta…"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="btn-send" id="sendBtn" onclick="sendMessage()" title="Enviar">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">
        <span class="hint-text">Presiona <kbd>Enter</kbd> para enviar · <kbd>Shift+Enter</kbd> nueva línea</span>
        <span class="status-dot">Conectado a localhost:8080</span>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://liferay.local.certificacion/o/ai-cert/v1.0/ask';
    const AUTH    = 'Basic dGVzdEBsaWZlcmF5LmNvbTp0ZXN0';

    const chat      = document.getElementById('chat');
    const input     = document.getElementById('questionInput');
    const sendBtn   = document.getElementById('sendBtn');
    const emptyState = document.getElementById('emptyState');

    let thinkingEl = null;

    /* ── Auto-resize textarea ─────────────────────────────────── */
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 160) + 'px';
    }

    /* ── Key handler ──────────────────────────────────────────── */
    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    /* ── Hide empty state ─────────────────────────────────────── */
    function hideEmpty() {
      if (!emptyState.classList.contains('hidden')) {
        emptyState.classList.add('hidden');
      }
    }

    /* ── Append a message ─────────────────────────────────────── */
    function appendMessage(role, text) {
      hideEmpty();
      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = role === 'user' ? '👤' : '⚡';

      const body = document.createElement('div');
      body.className = 'msg-body';

      const label = document.createElement('div');
      label.className = 'msg-label';
      label.textContent = role === 'user' ? 'Tú' : 'AI·CERT';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;

      body.appendChild(label);
      body.appendChild(bubble);
      wrap.appendChild(avatar);
      wrap.appendChild(body);
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
      return wrap;
    }

    /* ── Thinking indicator ───────────────────────────────────── */
    function showThinking() {
      hideEmpty();
      thinkingEl = document.createElement('div');
      thinkingEl.className = 'msg ai thinking';
      thinkingEl.innerHTML = `
        <div class="msg-avatar">⚡</div>
        <div class="msg-body">
          <div class="msg-label">AI·CERT</div>
          <div class="msg-bubble">
            <div class="dots">
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
            </div>
          </div>
        </div>`;
      chat.appendChild(thinkingEl);
      chat.scrollTop = chat.scrollHeight;
    }

    function hideThinking() {
      if (thinkingEl) {
        thinkingEl.remove();
        thinkingEl = null;
      }
    }

    /* ── Send suggestion ──────────────────────────────────────── */
    function sendSuggestion(btn) {
      input.value = btn.textContent;
      sendMessage();
    }

    /* ── Clear chat ───────────────────────────────────────────── */
    function clearChat() {
      chat.innerHTML = '';
      chat.appendChild(emptyState);
      emptyState.classList.remove('hidden');
    }

    /* ── Main send ────────────────────────────────────────────── */
    async function sendMessage() {
      const question = input.value.trim();
      if (!question) return;

      // Lock UI
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      appendMessage('user', question);
      showThinking();

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': AUTH,
          },
          body: JSON.stringify({ question }),
        });

        hideThinking();

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`HTTP ${res.status}: ${errText}`);
        }

        const data = await res.json();
        appendMessage('ai', data.answer ?? '(Sin respuesta)');
      } catch (err) {
        hideThinking();
        const wrap = appendMessage('ai', `Error al contactar la API: ${err.message}`);
        wrap.classList.add('error');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }
  </script>
</body>
</html>
